name: Native Windows storage
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-push]
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated runner test dependencies
        run: python -m pip install 'pywin32==311' 'pytest>=8,<10' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Run actual native API and full extension tests
        run: python -m pytest -c tests/pytest.ini tests -q -p no:cacheprovider --junitxml=windows-results.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.python }}
          path: windows-results.xml
          retention-days: 14
